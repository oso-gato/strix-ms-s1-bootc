# libvirt state and config both live on the data drive (R7). This is
# RequiresMountsFor DELIBERATELY (fail-closed): if the data drive is absent,
# the daemon must NOT start against image config — it would write VM images
# and nvram onto the disposable system drive. The box still boots (mounts are
# nofail); libvirt is simply down until the drive returns.
[Unit]
RequiresMountsFor=/var/lib/libvirt /etc/libvirt
