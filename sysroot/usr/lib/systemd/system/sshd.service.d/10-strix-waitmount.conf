# nofail on var-home.mount drops the implicit Before=local-fs.target edge;
# without this wait, the first SSH attempt can race the mount and reject the
# key (authorized_keys lives in /var/home/core/.ssh). strix-home-seed also
# runs before sshd so a fresh data drive is populated first.
[Unit]
RequiresMountsFor=/var/home
After=strix-home-seed.service
Wants=strix-home-seed.service
