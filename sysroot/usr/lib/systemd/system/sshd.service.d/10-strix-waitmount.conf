# WantsMountsFor (not Requires-): sshd must order AFTER the var-home mount
# attempt so authorized_keys is in place — but if the nofail data drive is
# dead, sshd must still START (against the Anaconda-seeded system-drive
# home), or the headless box becomes unreachable exactly when it most needs
# SSH. RequiresMountsFor would cancel sshd as dependency-failed (P4 review;
# systemd adds hard Requires= regardless of nofail).
[Unit]
WantsMountsFor=/var/home
After=strix-home-seed.service
Wants=strix-home-seed.service
