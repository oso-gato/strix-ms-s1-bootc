# strix machine-local structure under /var (image /var never reaches
# installed machines on updates — tmpfiles is the durable mechanism).
#   /var/lib/strix  : service state markers
#   /run/strix      : per-boot tokens
#   linger/core     : start core's user manager at boot (claudebox daily
#                     timer is a user unit; linger arms it without a login)
d /var/lib/strix 0755 root root -
d /run/strix 0755 root root -
f /var/lib/systemd/linger/core 0644 root root -
