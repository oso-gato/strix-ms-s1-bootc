# strix machine-local structure under /var (image /var never reaches
# installed machines on updates — tmpfiles is the durable mechanism).
#   /var/lib/strix  : service state markers
#   /run/strix      : per-boot tokens
#   linger/core     : start core's user manager at boot (claudebox daily
#                     timer is a user unit; linger arms it without a login)
d /var/lib/strix 0755 root root -
d /run/strix 0755 root root -
f /var/lib/systemd/linger/core 0644 root root -

# pcp log tree (A6 × R9 fix): pcp ships /var/log/pcp/* as real RPM dirs, but
# the strix-log partition mounts a FRESH empty fs over /var/log on first boot,
# hiding them — so pmcd/pmlogger/pmproxy have nowhere to write and fail to
# start. tmpfiles recreates the tree on every boot, before the daemons.
# (VM validation caught this: the daemons were dead on a fresh install.)
d /var/log/pcp 0775 pcp pcp -
d /var/log/pcp/pmcd 0775 pcp pcp -
d /var/log/pcp/pmfind 0775 pcp pcp -
d /var/log/pcp/pmie 0775 pcp pcp -
d /var/log/pcp/pmlogger 0775 pcp pcp -
d /var/log/pcp/pmproxy 0775 pcp pcp -
