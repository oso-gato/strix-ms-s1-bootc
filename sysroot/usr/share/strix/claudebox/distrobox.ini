# claudebox — strix's AI maintenance workbench, declaratively defined (R8).
# Rebuild = destroy + recreate from THIS file (claudebox-rebuild); the host is
# never mutated. Fedora version pinned to the host's generation; bump
# deliberately with the base image.
[claudebox]
image=quay.io/fedora/fedora-toolbox:44
pull=true
replace=false
# Do NOT add init=true: distrobox gates the host /run/user/<uid> bind-mount on
# init=0 — an initful box silently loses the host podman socket.
#
# Anthropic's official dnf repo must exist BEFORE package install → pre_init
# hook. Channel = `latest` (D11): the DAILY box rebuild keeps Claude Code
# current so new models are selectable day one. GPG key fingerprint
# 31DD DE24 DDFA B679 F42D 7BD2 BAA9 29FF 1A7E CACE.
#
# HOOK QUOTING IS LOAD-BEARING (distrobox assemble double-eval): hooks here
# are single-quoted-only, no double quotes, no shell keywords. Anything
# needing redirects or its own quoting is applied AFTER assemble over the
# quote-safe `distrobox enter -- sudo` channel — see claudebox-init.sh.
pre_init_hooks=sh -c 'set -f; echo [claude-code] > /etc/yum.repos.d/claude-code.repo; echo name=Claude Code >> /etc/yum.repos.d/claude-code.repo; echo baseurl=https://downloads.claude.ai/claude-code/rpm/latest >> /etc/yum.repos.d/claude-code.repo; echo enabled=1 >> /etc/yum.repos.d/claude-code.repo; echo gpgcheck=1 >> /etc/yum.repos.d/claude-code.repo; echo gpgkey=https://downloads.claude.ai/keys/claude-code.asc >> /etc/yum.repos.d/claude-code.repo'
# bubblewrap = claude-code's sandboxed-bash backend; socat = host-bridge
# shims (both A3, matching fedora-bootstrap's box package set).
additional_packages=claude-code host-spawn bubblewrap socat podman git gh tmux
