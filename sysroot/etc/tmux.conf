# strix tmux server config (R4a/R4b): multi-device geometry policy + clean
# co-view. A tmux window has exactly ONE size shared by every client viewing
# it; what we control is which single size wins and how the mismatched client
# degrades:
#   window-size=latest : the session follows the client that most recently
#     TYPED — pick up the iPad and type and it rescales; both stay connected
#     (mosh-friendly); the idle device blank-letterboxes/crops and reclaims
#     full size on its next keystroke.
#   fill-character ' ' : an idle larger device's surplus is BLANK, not the
#     compiled-default '·' (the "screen full of dots" garble look).
#   aggressive-resize  : devices parked on DIFFERENT windows each get their
#     own size.
#   attach/resize hooks: full server-driven repaint so clients that won't
#     self-redraw (xterm.js / Guacamole WebSSH / mosh) get a clean frame
#     after every rescale (R4e — the fedora-desktop browser-terminal path).
set -g default-terminal "tmux-256color"
set -g window-size latest
setw -g aggressive-resize on
setw -g fill-character ' '
set-hook -g client-attached 'refresh-client'
set-hook -g client-resized  'refresh-client'
