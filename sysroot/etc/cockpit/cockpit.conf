[WebService]
; LoginTo=false — disables the remote-host login pivot (CVE-2026-4631
; mitigation); single-host homelab, zero functional value here.
; AllowUnencrypted=false — Cockpit's default, declared defensively so a
; config reload can't silently flip it.
; MaxStartups=10 — caps concurrent unauthenticated sessions (brute-force
; dampener), matches sshd's same-named default.
; Socket stays default [::]:9090 all-interfaces: LAN + tailnet reachable;
; the access boundary is the network layer (R6). No RequireHost.
LoginTo = false
AllowUnencrypted = false
MaxStartups = 10
