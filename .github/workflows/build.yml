# strix fortnightly build & publish (R11/R10).
#
# 1. podman-builds the bootc image from ./Containerfile on the current
#    fedora-bootc:44 base and pushes ghcr.io/oso-gato/strix-ms-s1-bootc
#    (:stable + :v<version>). The box's bootc-fetch-apply-updates.timer pulls
#    :stable — this schedule IS the OS update cadence.
# 2. Runs ./build-iso.sh (bootc-image-builder anaconda-iso) to produce
#    strix-preserve.iso + strix-wipe.iso from the just-pushed image, and
#    publishes them on a GitHub Release tagged from CHANGELOG.md.
#
# No secrets: only the auto-provided GITHUB_TOKEN (ghcr push + Release).
# SSH keys are fetched from github.com/oso-gato.keys inside build-iso.sh
# (anti-brick gate: zero keys = fail).
#
# Runner notes (verified against osbuild/image-builder issue #446, 2026-07-11):
# ubuntu-24.04 required (22.04 ships Podman v3 — too old); the storage
# graph-driver workaround below is the documented fix for BIB on GH runners.

name: build

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 06:00 UTC, 1st + 15th — fortnightly
  workflow_dispatch:

permissions:
  contents: write   # create the Release
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/oso-gato/strix-ms-s1-bootc

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ISO output + embedded image + osbuild store need room the stock
      # runner doesn't have — drop the big preinstalled toolchains.
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      # BIB-on-GH-runner storage workaround (osbuild/image-builder #446):
      # reset root's container storage and pin the overlay driver explicitly.
      - name: Prepare rootful podman storage
        run: |
          set -euo pipefail
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf >/dev/null
          sudo podman info --format '{{.Store.GraphDriverName}}'

      # Version tags stay IMMUTABLE (P4 review): a manual dispatch releases
      # the CHANGELOG version verbatim; scheduled fortnightly rebuilds append
      # a date suffix so they never overwrite an existing release/image tag —
      # :stable is the only moving pointer.
      - name: Read release version from CHANGELOG
        id: ver
        run: |
          set -euo pipefail
          v="$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## //')"
          test -n "$v"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            v="$v-$(date -u +%Y%m%d)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v (event: ${GITHUB_EVENT_NAME})"

      - name: Build bootc image
        run: |
          set -euo pipefail
          sudo podman build --pull=always \
            -t "$IMAGE:stable" \
            -t "$IMAGE:${{ steps.ver.outputs.version }}" .

      - name: Push to ghcr.io
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE:stable"
          sudo podman push "$IMAGE:${{ steps.ver.outputs.version }}"

      # build-iso.sh pulls $IMAGE:stable back from ghcr (so the ISO embeds
      # exactly what was published), renders the two kickstarts with the
      # fetched SSH keys, and runs bootc-image-builder twice.
      - name: Build ISOs
        run: |
          set -euo pipefail
          ./build-iso.sh

      # Publish the WHOLE ISOs to ghcr as an OCI artifact (via oras) — a
      # single-file, 2-GiB-cap-free download alongside the container image.
      # MUST run before the split step (which deletes the whole ISOs).
      # oras is CI tooling on the runner (not layered into the target image),
      # pinned by version + verified against its own published checksum.
      - name: Install oras (pinned + checksum-verified)
        run: |
          set -euo pipefail
          ORAS_VERSION=1.3.3
          ORAS_SHA=9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
          curl -fsSLo oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA}  oras.tar.gz" | sha256sum -c -
          tar -xzf oras.tar.gz oras
          sudo install -m0755 oras /usr/local/bin/oras
          rm -f oras oras.tar.gz
          oras version

      - name: Publish ISOs to ghcr as an OCI artifact
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          # One artifact carrying BOTH whole ISOs as layers. Pull with:
          #   oras pull ghcr.io/oso-gato/strix-ms-s1-bootc:installer
          oras push \
            --artifact-type application/vnd.strix.installer \
            "$IMAGE:installer-${{ steps.ver.outputs.version }}" \
            strix-wipe.iso:application/vnd.strix.iso \
            strix-preserve.iso:application/vnd.strix.iso
          # Floating tag → newest installer (mirrors :stable for the image).
          oras tag "$IMAGE:installer-${{ steps.ver.outputs.version }}" installer

      # GitHub Release assets cap at 2 GiB; a bootc anaconda ISO embeds the
      # whole image and exceeds it. Ship split parts + checksums; reassemble
      # with `cat` (see release body / README).
      - name: Split ISOs for the 2 GiB release-asset limit
        run: |
          set -euo pipefail
          sha256sum strix-preserve.iso strix-wipe.iso > SHA256SUMS
          for v in preserve wipe; do
            split -b 1900M -d "strix-$v.iso" "strix-$v.iso.part"
            rm "strix-$v.iso"
          done
          sha256sum strix-*.iso.part* >> SHA256SUMS
          ls -lh strix-* SHA256SUMS

      - name: Publish Release
        # Pinned by commit SHA (v2 tag as of 2026-07-11) — this step holds
        # contents:write in a pipeline that feeds an auto-updating host OS.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: strix ${{ steps.ver.outputs.version }}
          body: |
            Automated strix build.

            Image: ghcr.io/oso-gato/strix-ms-s1-bootc:stable (also tagged ${{ steps.ver.outputs.version }})
            Installed systems track :stable via bootc auto-updates.

            Assets are SPLIT (GitHub caps release assets at 2 GiB). Download the parts
            for the variant you need, reassemble, verify (run only the block for the
            variant you downloaded — a cat with no parts present creates a bogus file):

            PRESERVE (reinstalls the OS, KEEPS the 4 TB data drive — match-or-halt):

                cat strix-preserve.iso.part* > strix-preserve.iso
                sha256sum -c SHA256SUMS --ignore-missing
                # macOS: shasum -a 256 -c SHA256SUMS --ignore-missing

            WIPE (reinstalls the OS, RECREATES the 4 TB data drive — first install /
            migration from noir):

                cat strix-wipe.iso.part* > strix-wipe.iso
                sha256sum -c SHA256SUMS --ignore-missing
                # macOS: shasum -a 256 -c SHA256SUMS --ignore-missing

            No credentials are baked; first boot: `ssh core@strix && sudo strix-setup`.
          files: |
            strix-preserve.iso.part*
            strix-wipe.iso.part*
            SHA256SUMS
